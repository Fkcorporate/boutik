<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Boutik — Console éditeur</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#0d0f12;--mut:#6b7280;--line:#e7e9ee;--acc:#ff5b1f;--accl:#fff1ea;--ok:#0f9d58;--okl:#e7f6ee;--bad:#e03131;--badl:#fdecec;--warn:#e08600;--warnl:#fff5e0;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
header{background:var(--ink);color:#fff}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
header b{font-size:17px;flex:1}header small{opacity:.6;font-weight:600}
.logo{width:36px;height:36px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
h1{font-size:26px;margin:8px 0 16px;letter-spacing:-.02em}
h3{font-size:13px;color:var(--mut);margin:22px 2px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--mut);font-weight:600}.kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.dark{background:var(--ink);color:#fff}.kpi.dark .k{color:rgba(255,255,255,.6)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.acc{background:var(--acc)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.soft{background:#e9ecf2;color:var(--ink)}.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:44px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 2px 5px}
.chip{border:0;background:var(--card);box-shadow:var(--sh);border-radius:30px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.pill{display:inline-block;padding:3px 9px;border-radius:30px;font-size:12px;font-weight:700;background:#eef0f4;white-space:nowrap}
.pill.ok{background:var(--okl);color:var(--ok)}.pill.bad{background:var(--badl);color:var(--bad)}.pill.warn{background:var(--warnl);color:var(--warn)}.pill.acc{background:var(--accl);color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.tap{cursor:pointer}tr.tap:hover td{background:#fafbfc}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(13,15,18,.5);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:18px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.login .card{width:100%;max-width:380px;padding:26px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;z-index:60}
.qr{display:flex;justify-content:center;background:#fff;border-radius:16px;padding:16px}
.code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#fff;border-radius:12px;padding:10px;border:1px dashed var(--line)}
@media(max-width:760px){.hide-m,header small{display:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
</style>
</head>

// Mini encodeur QR (mode octet, correction M, versions 1-10)
const QR = (() => {
  const ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLK_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  function rawModules(v) {

    for (; v <= 10; v++) { const cc = v < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCw(v) * 8) break; }
    if (v > 10) throw new Error('Texte trop long pour le QR');

    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));

      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,

      let p = 0, dark = 0;
      for (let y = 0; y < size; y++) for (let a = 0; a < 2; a++) {

        for (let x = 1; x < size; x++) {

      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (m[y][x]) dark++;
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let k = 0; k < 8; k++) { applyMask(k); drawFormat(k); const p = penalty(); if (p < bestP) { bestP = p; best = k; } applyMask(k); }
    applyMask(best); drawFormat(best);
    return m;
  }
  function svg(text, px = 4) {
    const m = encode(text), n = m.length, q = 2;
    let d = '';

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" width="${(n + 2 * q) * px}" height="${(n + 2 * q) * px}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { encode, svg };
})();

function open(id) {
  const s = shop(id), st = s.stats, price = D.config.price, cur = D.config.currency;
  const remind = `Bonjour ${st.owner || ''}, votre abonnement Boutik pour « ${st.shopName} » ${s.sub.daysLeft >= 0 ? 'expire le ' + fd(s.sub.until) : 'a expiré le ' + fd(s.sub.until)}. Pour continuer : ${nf(price)} ${cur} par mois. Merci !`;
  const phone = (s.info.phone || st.ownerPhone || '').replace(/\D/g, '');
  drawer(`<div class="row"><h1 class="grow" style="margin:0">${esc(st.shopName)}</h1><button class="btn soft sm" onclick="BK.close()">Fermer</button></div>
    <div class="mut" style="margin:4px 0 14px">Créée le ${fd(s.created)} · dernière activité ${ago(s.lastSeen)} · n° ${s.id}</div>
    <div class="card"><div class="row"><div class="grow"><div class="mut">Abonnement</div><div style="font-size:20px;font-weight:800">${statusPill(s)} <span style="font-size:15px">jusqu'au ${fd(s.sub.until)}</span></div></div>
      <button class="btn sm ${s.plan.suspended ? 'ok' : 'soft'}" onclick="BK.suspend('${id}',${!s.plan.suspended})">${s.plan.suspended ? 'Réactiver' : 'Suspendre'}</button></div>
      <h3 style="margin-top:16px">Enregistrer un paiement</h3>
      <div class="g4">${[1, 3, 6, 12].map(m => `<button class="btn soft sm mo" data-m="${m}" onclick="BK.pickM(${m})">${m} mois</button>`).join('')}</div>
      <div class="g2"><div><label class="f">Montant reçu (${esc(cur)})</label><input id="pa" inputmode="numeric" value="${price}"></div><div><label class="f">Moyen</label><select id="pm"><option>Mobile Money</option><option>Espèces</option><option>Virement</option><option>Autre</option></select></div></div>
      <label class="f">Note</label><input id="pn" placeholder="Ex : réf. Wave, payé par le gérant">
      <button class="btn ok" style="width:100%;margin-top:12px" onclick="BK.extend('${id}')">Valider : +<span id="pmo">1</span> mois</button>
      <div class="row" style="margin-top:10px"><input id="td" inputmode="numeric" placeholder="Jours offerts" style="max-width:140px"><button class="btn soft sm" onclick="BK.trial('${id}')">Offrir des jours d'essai</button></div>
      ${phone ? `<a class="btn soft sm" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/${phone}?text=${encodeURIComponent(remind)}">Relancer sur WhatsApp</a>` : ''}</div>
    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><div class="k">Ventes 30 j</div><div class="v">${st.sales30}</div></div><div class="kpi"><div class="k">Chiffre 30 j</div><div class="v">${nf(st.ca30)}</div></div><div class="kpi"><div class="k">Téléphones</div><div class="v">${st.devices}</div></div>
      <div class="kpi"><div class="k">Produits</div><div class="v">${st.products}</div></div><div class="kpi"><div class="k">Vendeurs</div><div class="v">${st.employees}</div></div><div class="kpi"><div class="k">Dernière vente</div><div class="v" style="font-size:16px">${ago(st.lastSale)}</div></div></div>
    <h3>Fiche client</h3><div class="card">
      <div class="g2"><div><label class="f" style="margin-top:0">Nom du client</label><input id="ic" value="${esc(s.info.client || st.owner)}"></div><div><label class="f" style="margin-top:0">Téléphone / WhatsApp</label><input id="ip" value="${esc(s.info.phone || st.ownerPhone)}"></div></div>
      <label class="f">Ville / quartier</label><input id="iv" value="${esc(s.info.city || '')}"><label class="f">Notes</label><textarea id="in" rows="3">${esc(s.info.note || '')}</textarea>
      <button class="btn" style="margin-top:10px" onclick="BK.info('${id}')">Enregistrer la fiche</button></div>
    <h3>Paiements reçus</h3><div class="card" style="padding:6px 12px">${s.pays.length ? `<table>${s.pays.map(p => `<tr><td>${fd(p.date)}<div class="mut">${esc(p.method)}${p.note ? ' · ' + esc(p.note) : ''}</div></td><td>${p.months ? p.months + ' mois' : ''}${p.days ? p.days + ' j' : ''}</td><td class="n"><b>${nf(p.amount)}</b></td><td class="n"><button class="btn soft sm" onclick="BK.unpay('${id}','${p.id}')">✕</button></td></tr>`).join('')}</table>` : '<div class="mut" style="padding:14px">Aucun paiement</div>'}</div>
    <h3>Téléphones connectés</h3><div class="card" style="padding:6px 12px">${Object.keys(s.devicesList).length ? `<table>${Object.entries(s.devicesList).map(([d, x]) => `<tr><td><b>${esc(d.slice(0, 8))}</b><div class="mut">${esc(x.ua)}</div></td><td class="n">${ago(x.seen)}</td></tr>`).join('')}</table>` : '<div class="mut" style="padding:14px">Aucun</div>'}</div>
    <h3>Sécurité</h3><div class="card"><div class="mut">Si le client a perdu un téléphone ou si son code de jumelage a circulé : créez un nouveau code. Tous les téléphones sont déconnectés et doivent rejoindre la boutique avec le nouveau code. Rien n'est perdu.</div>
      <button class="btn bad" style="margin-top:12px" onclick="BK.rekey('${id}')">Créer un nouveau code de jumelage</button><div id="newcode"></div></div>`);
}
let pickedM = 1;
const BK = window.BK = {
  f(k) { filter = k; main(); }, open, close: closeD,
  pickM(m) { pickedM = m; document.querySelectorAll('.mo').forEach(b => { b.classList.toggle('acc', +b.dataset.m === m); b.classList.toggle('soft', +b.dataset.m !== m); }); $('pa').value = D.config.price * m; $('pmo').textContent = m; },
  async act(id, what, body, msg) { try { const j = await api(`shop/${id}/${what}`, body); const i = D.shops.findIndex(s => s.id === id); D.shops[i] = j.shop; if (msg) toast(msg); return j; } catch (e) { if (e.message !== 'auth') toast(e.message); } },
  async extend(id) { const j = await BK.act(id, 'extend', { months: pickedM, amount: +$('pa').value || 0, method: $('pm').value, note: $('pn').value }, 'Paiement enregistré'); if (j) { main(); open(id); } },
  async trial(id) { const d = +$('td').value; if (!d) return toast('Nombre de jours ?'); const j = await BK.act(id, 'extend', { days: d, trial: true }, d + ' jours offerts'); if (j) { main(); open(id); } },
  async suspend(id, on) { if (on && !confirmIn('Suspendre cette boutique ? Ses téléphones continuent de vendre mais ne se synchronisent plus.')) return; const j = await BK.act(id, 'suspend', { on }, on ? 'Boutique suspendue' : 'Boutique réactivée'); if (j) { main(); open(id); } },
  async info(id) { const j = await BK.act(id, 'info', { client: $('ic').value, phone: $('ip').value, city: $('iv').value, note: $('in').value }, 'Fiche enregistrée'); if (j) main(), open(id); },
  async unpay(id, pid) { if (!confirmIn('Supprimer ce paiement de l\'historique ? (la date d\'expiration ne change pas)')) return; const j = await BK.act(id, 'unpay', { id: pid }, 'Paiement supprimé'); if (j) { main(); open(id); } },
  async rekey(id) { if (!confirmIn('Créer un nouveau code ? Tous les téléphones de cette boutique devront se reconnecter.')) return; const j = await BK.act(id, 'rekey', {}); if (j && j.code) { main(); open(id); $('newcode').innerHTML = `<div class="qr" style="margin-top:12px">${QR.svg(j.code, 5)}</div><div class="code" style="margin-top:8px">${esc(j.code)}</div><div class="mut" style="margin-top:6px">Sur le téléphone du client : « Rejoindre ma boutique » puis scanner ce code.</div>`; } },
  settings() { drawer(`<div class="row"><h1 class="grow" style="margin:0">Réglages</h1><button class="btn soft sm" onclick="BK.close()">Fermer</button></div>
    <div class="card" style="margin-top:14px"><div class="g2"><div><label class="f" style="margin-top:0">Prix par mois</label><input id="cp" inputmode="numeric" value="${D.config.price}"></div><div><label class="f" style="margin-top:0">Monnaie</label><input id="cc" value="${esc(D.config.currency)}"></div></div>
    <h3>Site public et stores</h3>
    <label class="f">Lien Google Play (vide = « bientôt »)</label><input id="cpl" value="${esc(D.config.playUrl || '')}" placeholder="https://play.google.com/store/apps/details?id=…">
    <label class="f">Lien App Store (vide = « bientôt »)</label><input id="cas" value="${esc(D.config.appStoreUrl || '')}" placeholder="https://apps.apple.com/…">
    <div class="g2"><div><label class="f">WhatsApp commercial</label><input id="cwa" value="${esc(D.config.whatsapp || '')}" placeholder="2250700000000"></div><div><label class="f">E-mail de contact</label><input id="cem" value="${esc(D.config.email || '')}"></div></div>
    <label class="f">Éditeur (nom de la société, affiché sur le site et la politique de confidentialité)</label><input id="ced" value="${esc(D.config.editor || '')}">
    <button class="btn" style="margin-top:12px" onclick="BK.saveCfg()">Enregistrer</button></div>
    <div class="card mut">Réglés sur Render (variables d'environnement) : essai gratuit <b>TRIAL_DAYS</b> = ${D.trialDays} j · délai de grâce <b>GRACE_DAYS</b> = ${D.graceDays} j · contact affiché aux clients <b>SUPPORT_CONTACT</b> = ${esc(D.support || '—')} · mot de passe <b>ADMIN_PASSWORD</b>.</div>`); },
  async saveCfg() { try { const j = await api('config', { price: +$('cp').value || 0, currency: $('cc').value, playUrl: $('cpl').value, appStoreUrl: $('cas').value, whatsapp: $('cwa').value, email: $('cem').value, editor: $('ced').value }); D.config = j.config; toast('Réglages enregistrés'); closeD(); main(); } catch (e) { if (e.message !== 'auth') toast(e.message); } },
  async logout() { try { await api('logout', {}); } catch (e) {} TOKEN = null; try { sessionStorage.removeItem('bk_admin'); } catch (e) {} loginView(); },
  csv() { const rows = [['Boutique', 'Client', 'Téléphone', 'Ville', 'Statut', 'Expire le', 'Dernière activité', 'Ventes 30j', 'CA 30j', 'Payé total', 'Créée le', 'N°']]; D.shops.forEach(s => rows.push([s.stats.shopName, s.info.client || s.stats.owner, s.info.phone || s.stats.ownerPhone, s.info.city || '', s.sub.status, fd(s.sub.until), s.lastSeen ? new Date(s.lastSeen).toLocaleString('fr-FR') : '', s.stats.sales30, s.stats.ca30, s.pays.reduce((a, p) => a + p.amount, 0), fd(s.created), s.id]));
    const t = '﻿' + rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = 'boutik-clients.csv'; a.click(); }
};
function confirmIn(t) { try { return window.confirm(t); } catch (e) { return true; } }
TOKEN ? load() : loginView();
}
</script>
</body>
</html>
