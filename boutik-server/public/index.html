<html lang="fr">
<head>

<style>
/* VOICE: calme, net, haut de gamme — un terminal de paiement de luxe
   IDEA: le ticket de caisse et le coffre — chaque vente laisse une trace vérifiable
   PICTURE: grandes cartes blanches, chiffres forts, carte d'en-tête noire
   COLOUR/TYPE: encre #0d0f12, fond gris perle, accent orange marché #ff5b1f ; Plus Jakarta Sans
   LAYOUT: mobile d'abord, barre du bas, actions principales énormes */
:root{--bg:#f3f4f6;--card:#fff;--ink:#0d0f12;--ink2:#2a2f37;--mut:#6b7280;--line:#e7e9ee;--acc:#ff5b1f;--accl:#fff1ea;--ok:#0f9d58;--okl:#e7f6ee;--bad:#e03131;--badl:#fdecec;--warn:#e08600;--warnl:#fff5e0;--r:20px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.big,.kv{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}svg.i.l{width:28px;height:28px}
#app{max-width:780px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.top{position:sticky;top:0;z-index:5;background:rgba(243,244,246,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 18px;display:flex;align-items:center;gap:12px}
.top .t{flex:1}.top .t b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}.top .t span{font-size:12.5px;color:var(--mut)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--ink);color:#fff;flex:none}
.av.e{background:#e9ecf2;color:var(--ink2)}.av.xl{width:64px;height:64px;font-size:24px}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer}
main{padding:4px 16px 90px}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 14px;font-weight:800}
h3{font-size:13px;font-weight:700;color:var(--mut);margin:22px 4px 10px;letter-spacing:.01em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,91,31,.35),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13px;opacity:.7}.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px}
.hero .row2{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}.hero .row2 b{display:block;font-size:16px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}
.mut{color:var(--mut);font-size:13px}.r{text-align:right}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;text-decoration:none;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.soft{background:#e9ecf2;color:var(--ink)}.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.btn.sm{padding:8px 13px;min-height:40px;font-size:14px;border-radius:12px}
.btn.full{width:100%}.btn:disabled{opacity:.4}
.btn.xl{min-height:64px;font-size:17px;border-radius:20px}
.btn.col{flex-direction:column;gap:2px;line-height:1.2}.btn.col small{font-weight:600;opacity:.75;font-size:13px}
.sync{width:10px;height:10px;border-radius:50%;background:#c4c8cf;display:inline-block;margin-left:6px;vertical-align:middle}.sync.ok{background:var(--ok)}.sync.busy{background:var(--warn)}.sync.err{background:var(--bad)}
.pc .ph{background-size:cover;background-position:center}
details.adv summary{cursor:pointer;font-weight:700;padding:14px 2px;list-style:none}details.adv summary::-webkit-details-marker{display:none}
.phprev{width:84px;height:84px;border-radius:16px;background:#e9ecf2 center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut)}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;min-height:50px;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--ink)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 2px 6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px}
.kpi .k{font-size:12.5px;color:var(--mut);font-weight:600}.kpi .kv{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:30px;font-size:12px;font-weight:700;background:#eef0f4;color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--okl);color:var(--ok)}.pill.bad{background:var(--badl);color:var(--bad)}.pill.warn{background:var(--warnl);color:var(--warn)}.pill.acc{background:var(--accl);color:var(--acc)}
.list>.it{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}.list>.it.tap{cursor:pointer}
.ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:#eef0f4}
.ico.acc{background:var(--accl);color:var(--acc)}.ico.ok{background:var(--okl);color:var(--ok)}.ico.bad{background:var(--badl);color:var(--bad)}.ico.warn{background:var(--warnl);color:var(--warn)}
.search{position:relative}.search svg{position:absolute;left:14px;top:14px;color:var(--mut)}.search input{padding-left:44px;background:var(--card);border-color:transparent;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:10px -2px 4px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--card);box-shadow:var(--sh);border-radius:30px;padding:9px 15px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--card);border:0;box-shadow:var(--sh);border-radius:18px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative}
.pc:active{transform:scale(.97)}
.pc .ph{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
.pc .n{font-weight:700;font-size:14px;line-height:1.25;min-height:2.5em}
.pc .p{font-weight:800;font-size:15px}
.pc .q{position:absolute;top:8px;right:8px;background:var(--acc);color:#fff;border-radius:20px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;padding:0 7px}
.pc.out{opacity:.5}
.cartbar{position:fixed;left:0;right:0;bottom:84px;z-index:6;max-width:780px;margin:0 auto;padding:0 16px}
.cartbar .btn{width:100%;justify-content:space-between;box-shadow:0 10px 30px rgba(13,15,18,.3)}
nav.bot{position:fixed;bottom:12px;left:12px;right:12px;z-index:7;background:rgba(13,15,18,.96);border-radius:24px;display:flex;max-width:756px;margin:0 auto;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;font-weight:600;color:rgba(255,255,255,.55);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:18px;position:relative}
nav.bot button.on{color:#fff;background:rgba(255,255,255,.1)}
nav.bot .dot{position:absolute;top:4px;right:calc(50% - 20px);background:var(--acc);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:12px;border:0;background:#eef0f4;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty span{min-width:28px;text-align:center;font-weight:800}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 4px;border-bottom:1px solid var(--line)}
table.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;z-index:20;background:rgba(13,15,18,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fd .18s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:780px;max-height:93vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px 24px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#cfd3da;margin:2px auto 10px}
.sheet .hd{display:flex;align-items:center;margin-bottom:10px}.sheet .hd h2{flex:1;margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.dlg{background:#fff;border-radius:24px;max-width:400px;width:calc(100% - 32px);padding:20px;margin:auto;animation:up .2s}
.seg{display:flex;background:#e6e8ec;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.login{min-height:100vh;background:var(--ink);color:#fff;padding:28px 20px 40px}
.login h1{font-size:30px;margin:26px 0 4px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:24px}
.ub{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px 10px;cursor:pointer;text-align:center;color:#fff}
.ub .av{margin:0 auto 10px;width:56px;height:56px;font-size:22px;background:#fff;color:var(--ink)}
.ub.own .av{background:var(--acc);color:#fff}
.ub small{display:block;opacity:.55;font-size:12px;margin-top:2px}
.pin{display:flex;justify-content:center;gap:16px;margin:18px 0 22px}
.pin i{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;opacity:.6;display:block}.pin i.f{background:currentColor;opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.pad button{height:64px;border-radius:50%;border:0;background:rgba(127,127,127,.12);font-size:24px;font-weight:600;cursor:pointer;color:inherit;display:flex;align-items:center;justify-content:center}
.pad button:active{background:rgba(127,127,127,.3)}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#scan{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
#scan .vw{position:relative;flex:1;overflow:hidden;min-height:220px}
#scan video,#scan canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .tb{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:16px;background:linear-gradient(rgba(0,0,0,.65),transparent);color:#fff;z-index:2;font-weight:700}
#scan .frame{position:absolute;inset:18% 10%;border:2px solid rgba(255,255,255,.5);border-radius:24px;z-index:1;pointer-events:none}
#scan .msg{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;color:#fff;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:14px;font-size:14px;text-align:center}
#scan .panel{background:var(--bg);max-height:46vh;overflow:auto;padding:14px 16px;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:3}
.flash{animation:fl .4s}@keyframes fl{0%{background:#d9f7e6}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92%;animation:up .2s}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b div{width:100%;max-width:34px;background:var(--ink);border-radius:8px}
.bars .b.today div{background:var(--acc)}
.bars .b span{font-size:11px;color:var(--mut);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:6px}
.flag{border-left:4px solid var(--bad)}
.den{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.den .d{background:#fff;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.den .d b{flex:1;font-size:14px}
.den .d input{width:58px;min-height:38px;padding:6px;text-align:center;border-radius:10px}
.sw{position:relative;width:50px;height:30px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#d5d8de;border-radius:20px;transition:.2s;cursor:pointer}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span::after{left:23px}
html.native-scan,html.native-scan body{background:transparent!important}html.native-scan #app,html.native-scan #ov{visibility:hidden}html.native-scan #scan{background:transparent}html.native-scan #scan .vw{background:transparent}
#printArea{display:none}
@media print{body{background:#fff}#app,.ov,#scan,.toast{display:none!important}#printArea{display:block!important}}
.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm}
.lab{border:1px dashed #999;padding:2mm;text-align:center;page-break-inside:avoid;font-family:Arial,sans-serif}
.lab svg{width:22mm;height:22mm;display:block;margin:0 auto}
.lab .ln{font-size:9pt;font-weight:700;line-height:1.1;margin-top:1mm;max-height:2.3em;overflow:hidden}
.lab .lp{font-size:10pt;font-weight:700}.lab .lc{font-size:7pt;color:#444}
@media (max-width:420px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .big{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
// Mini encodeur QR (mode octet, correction M, versions 1-10)
const QR = (() => {
  const ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLK_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  const dataCw = v => Math.floor(rawModules(v) / 8) - ECC_M[v] * BLK_M[v];
  function mul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; }
  function divisor(d) { const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1; for (let i = 0; i < d; i++) { for (let j = 0; j < d; j++) { r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; }
  function remainder(data, div) { const r = div.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); } return r; }
  function alignPos(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6];
    for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  }
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 10; v++) { const cc = v < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCw(v) * 8) break; }
    if (v > 10) throw new Error('Texte trop long pour le QR');
    const bits = [];
    const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(v) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    // ECC + entrelacement
    const nb = BLK_M[v], el = ECC_M[v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const blocks = [], div = divisor(el);
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) all.push(b[i]); });
    // Matrice
    const size = v * 4 + 17;
    const m = [...Array(size)].map(() => Array(size).fill(false));
    const fn = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, d) => { m[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([x, y]) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4);
      }
    });
    const ap = alignPos(v), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = (0 << 3) | mask; let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, g(i));
      set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true);
    };
    drawFormat(0);

function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 1150; g.gain.value = .1; o.connect(g); g.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 80); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}
}

function modal(title, html, onclose) {
  closeModal();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="sheet"><div class="grab"></div><div class="hd"><h2>${title}</h2><button class="ib" onclick="closeModal()">${ic('x', 's')}</button></div><div id="sheetBody">${html}</div></div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  ov._onclose = onclose; document.body.appendChild(ov);
}
function closeModal() { const o = document.getElementById('ov'); if (o) { o.remove(); o._onclose && o._onclose(); } }
function ask(msg, o = {}) {
  return new Promise(res => {
    document.getElementById('dlg')?.remove();
    const d = document.createElement('div'); d.className = 'ov'; d.id = 'dlg'; d.style.zIndex = 45; d.style.alignItems = 'center';
    d.innerHTML = `<div class="dlg"><div style="font-size:17px;font-weight:700;margin-bottom:6px">${msg}</div>${o.sub ? `<div class="mut">${o.sub}</div>` : ''}
      ${o.input ? `<input id="dlgIn" style="margin-top:12px" ${o.num ? 'inputmode="numeric"' : ''} value="${esc(o.value ?? '')}" placeholder="${esc(o.ph || '')}">` : ''}
      <div class="g2" style="margin-top:16px"><button class="btn soft" id="dlgNo">Annuler</button><button class="btn ${o.danger ? 'bad' : ''}" id="dlgOk">${o.ok || 'OK'}</button></div></div>`;
    document.body.appendChild(d);
    const inp = d.querySelector('#dlgIn'); if (inp) { setTimeout(() => inp.focus(), 50); inp.addEventListener('keydown', e => { if (e.key === 'Enter') d.querySelector('#dlgOk').click(); }); }
    d.querySelector('#dlgNo').onclick = () => { d.remove(); res(null); };
    d.querySelector('#dlgOk').onclick = () => { const val = inp ? inp.value.trim() : true; d.remove(); res(val); };
  });
}
// Autorisation du propriétaire : son code PIN sur l'appareil du vendeur
function ownerAuth(why) {
  if (isOwner()) return Promise.resolve(true);
  return new Promise(res => {
    let buf = '';
    const d = document.createElement('div'); d.className = 'ov'; d.id = 'auth'; d.style.zIndex = 46; d.style.alignItems = 'center';
    d.innerHTML = `<div class="dlg" style="text-align:center"><div class="ico acc" style="margin:0 auto 10px">${ic('lock')}</div>
      <div style="font-size:17px;font-weight:800">Autorisation du propriétaire</div><div class="mut" style="margin-top:4px">${why}</div>
      ${bioReady() ? `<button class="btn acc" id="abio" style="margin:14px auto 0;min-width:220px">${ic('finger')} Visage ou empreinte</button>` : ''}
      <div class="pin" id="apin"></div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="x">${ic('x')}</button><button data-k="0">0</button><button data-k="c">⌫</button></div></div>`;
    document.body.appendChild(d);
    const draw = () => d.querySelector('#apin').innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < buf.length ? 'f' : ''}"></i>`).join('');
    draw();
    const ab = d.querySelector('#abio'); if (ab) ab.onclick = async () => { if (await bioCheck()) { d.remove(); log('Autorisation propriétaire (biométrie)', why); res(true); } };
    d.querySelectorAll('.pad button').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'x') { d.remove(); res(false); return; }
      if (k === 'c') buf = buf.slice(0, -1); else if (buf.length < 4) buf += k;
      draw();
      if (buf.length === 4) {
        if (buf === db.settings.ownerPin) { d.remove(); log('Autorisation propriétaire', why); res(true); }
        else { const p = d.querySelector('.dlg'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); buf = ''; setTimeout(draw, 200); log('Code propriétaire erroné', why); save(); }
      }
    });
  });
}

  if (s.items.some(i => i.price < i.basePrice && !i.nego)) f.push(['warn', 'Prix baissé']);
  if (s.items.some(i => i.nego)) f.push(['', 'Négocié']);
  if (s.gros) f.push(['warn', 'Prix de gros']);
  if (s.items.some(i => i.price < i.cost)) f.push(['bad', 'Vendu à perte']);

function doOpenShift() {

  const s = { id: uid(), user: me.id, start: now(), fund: f, status: 'ouvert' };

const DENOMS = { FCFA: [10000, 5000, 2000, 1000, 500, 250, 200, 100, 50, 25, 10, 5] };
function shiftCalc(sh) {
  const end = sh.end || now();
  const sales = db.sales.filter(s => s.shift === sh.id);
  const ok = sales.filter(s => !s.cancelled);
  const sum = f => ok.filter(f).reduce((a, s) => a + s.total, 0);
  const cash = sum(s => s.pay === 'cash'), momo = sum(s => s.pay === 'momo'), cred = sum(s => s.pay === 'credit');
  const inR = d => d >= sh.start && d <= end && true;
  const rep = db.payments.filter(p => p.user === sh.user && p.method === 'cash' && inR(p.date)).reduce((a, p) => a + p.amount, 0);
  const exp = db.expenses.filter(e => !e.deleted && e.user === sh.user && e.method === 'cash' && inR(e.date)).reduce((a, e) => a + e.amount, 0);
  const flags = { momoBad: ok.filter(s => s.pay === 'momo' && s.momoOk === false).length, manual: 0, disc: 0, price: 0, canc: sales.filter(s => s.cancelled).length, req: sales.filter(s => s.cancelReq && !s.cancelled).length, momoNoRef: ok.filter(s => s.pay === 'momo' && !s.ref).length, flagged: sales.filter(s => s.flag).length };
  ok.forEach(s => { flags.manual += s.items.filter(i => i.manuel > 0).length; if (s.discount) flags.disc++; if (s.items.some(i => i.price < i.basePrice && !i.nego)) flags.price++; });
  const items = ok.reduce((a, s) => a + s.items.length, 0);
  return { sales, ok, n: ok.length, ca: sum(() => true), cash, momo, cred, rep, exp, expected: sh.fund + cash + rep - exp, flags, items };
}

function flagPills(f) {

function periodRange(p) { const e = new Date(), s = new Date(); s.setHours(0, 0, 0, 0); if (p === 'semaine') s.setDate(s.getDate() - 6); if (p === 'mois') s.setDate(1); return [s.toISOString(), e.toISOString()]; }
function empRisk(id, days = 30) {
  const from = new Date(Date.now() - days * 864e5).toISOString();
  const sh = db.shifts.filter(s => s.user === id && s.end && s.start >= from);
  const sales = db.sales.filter(s => s.user === id && s.date >= from);
  const ok = sales.filter(s => !s.cancelled);
  const items = ok.reduce((a, s) => a + s.items.length, 0), man = ok.reduce((a, s) => a + s.items.filter(i => i.manuel > 0).length, 0);
  return { shifts: sh.length, missing: sh.filter(s => s.diff < 0).reduce((a, s) => a + s.diff, 0), surplus: sh.filter(s => s.diff > 0).reduce((a, s) => a + s.diff, 0), canc: sales.filter(s => s.cancelled).length, disc: ok.filter(s => s.discount).length, manualPct: items ? Math.round(man / items * 100) : 0, ca: ok.reduce((a, s) => a + s.total, 0), n: ok.length };
}

  img.src = URL.createObjectURL(f);

function scanReceive() {
  const seen = new Set(); SCAN.onClose = () => recvRedraw();
  openScanner({ title: 'Produits reçus', panel: () => Object.keys(recv).map(id => `<div class="row" style="padding:6px 0"><div class="grow">${esc(prod(id).name)}</div><b>+${recv[id]}</b></div>`).join('') || '<span class="mut">Scannez…</span>',
    onCodes: (codes, manual) => { let a = 0; const t = Date.now(); codes.forEach(raw => { const r = resolveCode(raw); if (!r) return; if (!manual && (r.unique ? seen.has(raw) : (SCAN.lastSeen[raw] && t - SCAN.lastSeen[raw] < 1800))) { SCAN.lastSeen[raw] = t; return; } seen.add(raw); SCAN.lastSeen[raw] = t; recv[r.p.id] = (recv[r.p.id] || 0) + (r.pack ? r.p.pack.qty : 1); a++; }); if (a) { beep(); refreshScanPanel(); } } });

function makeLabels(mode) {
  const showPrice = document.getElementById('lprice').checked; let html = '', n = 0; const bt = [];
  document.querySelectorAll('.lq, .lqc').forEach(i => { const q = Math.min(500, +i.value || 0); if (!q) return; const p = prod(i.dataset.id), pk = i.classList.contains('lqc') && p.pack;
    for (let k = 0; k < q; k++) { p.labelSeq++; const code = `${p.code}-${pk ? 'C' : ''}${String(p.labelSeq).padStart(4, '0')}`; bt.push({ code, name: (pk ? p.pack.name + ' ' : '') + p.name, price: showPrice ? money(pk ? p.pack.price : p.price) : '' }); html += `<div class="lab">${QR.svg(code, 3)}<div class="ln">${pk ? esc(p.pack.name) + ' · ' : ''}${esc(p.name)}</div>${showPrice ? `<div class="lp">${money(pk ? p.pack.price : p.price)}</div>` : ''}<div class="lc">${code}</div></div>`; n++; } });

  const body = `<div class="labels">${html}</div>`;
  if (mode === 'download') {
    const css = [...document.styleSheets].flatMap(s => { try { return [...s.cssRules]; } catch (e) { return []; } }).filter(r => /\.lab/.test(r.cssText)).map(r => r.cssText).join('\n');
    download(`etiquettes-${today()}.html`, `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Étiquettes</title><style>@page{size:A4;margin:8mm}body{margin:0}${css}</style></head><body>${body}<script>window.onload=()=>window.print()<\/script></body></html>`, 'text/html');
    toast(`${n} étiquette(s) prêtes`);
  } else { document.getElementById('printArea').innerHTML = body; closeModal(); setTimeout(() => { try { window.print(); } catch (e) {} toast('Si rien ne s\'ouvre, utilisez « Télécharger »'); }, 300); }
}
async function download(name, content, type) {
  if (NATIVE && NATIVE.saveFile) { try { await NATIVE.saveFile(name, content); } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Partage impossible'); } return; }
  try { if (window.claude && window.claude.use) { const dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: content }); return; } } } catch (e) { return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

const SK = 'boutik_sync', HK = 'boutik_hash';
const SCOLS = ['products', 'employees', 'sales', 'expenses', 'moves', 'payments', 'shifts', 'counts', 'log', 'suppliers', 'supplies', 'supPays'];
const jget = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const SYNC = { cfg: jget(kf(SK)), hashes: jget(kf(HK)) || {}, busy: false, state: 'off', last: null, t: null, again: false };
function saveSyncState() { try { localStorage.setItem(kf(SK), JSON.stringify(SYNC.cfg)); localStorage.setItem(kf(HK), JSON.stringify(SYNC.hashes)); } catch (e) {} }
function setSync(st) { SYNC.state = st; const d = document.getElementById('syncdot'); if (d) d.className = 'sync ' + st; }
function scheduleSync() { if (!SYNC.cfg) return; clearTimeout(SYNC.t); SYNC.t = setTimeout(syncNow, 1500); }
const recKey = (c, r) => c + ':' + (c === 'settings' ? 'main' : r.id);
async function api(path, body, cfg = SYNC.cfg) {
  const r = await fetch(cfg.url + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; try { e.data = await r.json(); } catch (x) {} throw e; }
  return r.json();
}
function subBanner(full) {
  const sb = SYNC.cfg && SYNC.cfg.sub; if (!sb) return '';
  const fd = d => new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  if (sb.blocked) return `<div class="card row" style="background:var(--badl)"><div class="ico bad">${ic('lock')}</div><div class="grow"><b>Synchronisation arrêtée : abonnement ${esc(sb.status)}</b><div class="mut">Vos ventes restent enregistrées sur ce téléphone. ${sb.support ? 'Contact : ' + esc(sb.support) : 'Contactez votre fournisseur Boutik.'}</div></div></div>`;
  if (sb.daysLeft <= 7) return `<div class="card row" style="background:var(--warnl)"><div class="ico warn">${ic('clock')}</div><div class="grow"><b>${sb.daysLeft < 0 ? 'Abonnement expiré' : 'Abonnement : plus que ' + sb.daysLeft + ' jour' + (sb.daysLeft > 1 ? 's' : '')}</b><div class="mut">${sb.daysLeft < 0 ? 'Réglez rapidement pour ne pas couper la synchronisation.' : 'Expire le ' + fd(sb.until) + '.'} ${sb.support ? esc(sb.support) : ''}</div></div></div>`;
  return full ? `<div class="mut" style="margin-top:8px">Abonnement ${esc(sb.status)} jusqu'au ${fd(sb.until)}</div>` : '';
}
async function syncNow() {
  if (!SYNC.cfg || !db.settings) return;
  if (SYNC.busy) { SYNC.again = true; return; }
  if (navigator.onLine === false) return setSync('off');
  SYNC.busy = true; setSync('busy'); const cfg0 = SYNC.cfg;
  try {
    const t = now(), push = [], pend = {};
    const all = [['settings', db.settings]]; SCOLS.forEach(c => db[c].forEach(r => all.push([c, r])));
    for (const [c, r] of all) { const k = recKey(c, r); if (SYNC.hashes[k] !== JSON.stringify(r)) { r._u = t; pend[k] = JSON.stringify(r); push.push({ c, r }); } }
    if (push.length) saveLocal();
    if (!SYNC.cfg.device) { SYNC.cfg.device = uid(); saveSyncState(); }
    const j = await api('/api/sync', { shop: SYNC.cfg.shop, key: SYNC.cfg.key, device: SYNC.cfg.device, since: SYNC.cfg.since || 0, push });
    if (SYNC.cfg !== cfg0) return;
    Object.assign(SYNC.hashes, pend);
    let changed = false;
    for (const { c, r } of j.pull) if (applyRemote(c, r)) { changed = true; SYNC.hashes[recKey(c, r)] = JSON.stringify(r); }
    const wasBlocked = SYNC.cfg.sub && SYNC.cfg.sub.blocked; SYNC.cfg.sub = j.sub || SYNC.cfg.sub;
    SYNC.cfg.since = j.seq; SYNC.last = now(); saveSyncState(); if (wasBlocked) softRender();
    if (changed) { sortAll(); recomputeStock(); saveLocal(); softRender(); }
    setSync('ok');
  } catch (e) { if (e.status === 402 && e.data && e.data.sub && SYNC.cfg === cfg0) { const was = SYNC.cfg.sub && SYNC.cfg.sub.blocked; SYNC.cfg.sub = e.data.sub; saveSyncState(); if (!was) softRender(); } setSync('err'); }
  finally { SYNC.busy = false; if (SYNC.again) { SYNC.again = false; scheduleSync(); } }
}
function applyRemote(c, r, d = db) {
  if (c === 'settings') { if (!d.settings || (r._u || '') >= (d.settings._u || '')) { d.settings = r; return true; } return false; }
  if (!d[c]) d[c] = [];
  const i = d[c].findIndex(x => x.id === r.id);
  if (i < 0) { d[c].push(r); return true; }
  if ((r._u || '') >= (d[c][i]._u || '')) { d[c][i] = r; return true; }
  return false;
}
function softRender() {
  if (!me) { if (document.getElementById('pinzone') && !document.getElementById('pindots')) renderLogin(); return; }
  if (document.getElementById('ov') || document.getElementById('scan') || document.getElementById('dlg') || document.getElementById('auth')) return;
  const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
setInterval(syncNow, 20000);
window.addEventListener('online', syncNow);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });

async function enableOnline() {
  let url = v('srv').replace(/\/+$/, ''); if (!url) return toast('Indiquez l\'adresse du serveur');
  if (!/^https?:\/\//.test(url)) url = 'https://' + url;
  try {
    SYNC.cfg = { url, since: 0 };
    const j = await api('/api/register', { name: db.settings.shopName });
    SYNC.cfg = { url, shop: j.shop, key: j.key, since: 0, device: uid(), sub: j.sub }; SYNC.hashes = {}; saveSyncState();
    log('Boutique mise en ligne', url); save(); await syncNow(); render(); showPair();
  } catch (e) { SYNC.cfg = null; saveSyncState(); toast('Serveur injoignable. Vérifiez l\'adresse et internet.'); }
}
function showPair() {
  const code = pairCode();
  modal('Connecter un téléphone', `<p class="mut" style="margin-top:0">Sur l'autre téléphone, ouvrez Boutik, touchez <b style="color:var(--ink)">« Rejoindre ma boutique »</b> et scannez ce code.</p>

    <div class="card row" style="background:var(--warnl)"><div class="ico warn">${ic('lock')}</div><div class="grow mut">Ce code donne accès à toute la boutique. Ne le montrez qu'à vos propres téléphones.</div></div>

async function leaveOnline() { if (!(await ask('Déconnecter cet appareil du suivi à distance ?', { ok: 'Déconnecter', danger: true, sub: 'Les données restent sur ce téléphone.' }))) return; SYNC.cfg = null; SYNC.hashes = {}; saveSyncState(); render(); }
function joinSheet() {
  modal('Rejoindre ma boutique', `<p class="mut" style="margin-top:0">Sur le premier téléphone : Plus → Paramètres → « Connecter un autre téléphone ».</p>
    <button class="btn acc full xl" onclick="closeModal();openScanner({title:'Scanner le code de la boutique',allowManual:false,panel:()=>'',onCodes:c=>{const x=c.find(z=>z.startsWith('BOUTIK1|'));if(x){closeScanner();joinShop(x);}}})">${ic('scan')} Scanner le code</button>
    <label class="f">Ou collez le code reçu</label><textarea id="jcode" rows="3" placeholder="BOUTIK1|…"></textarea>
    <button class="btn full" style="margin-top:10px" onclick="joinShop(v('jcode'))">Rejoindre</button>`);
}
async function joinShop(raw) {
  const m = String(raw || '').trim().split('|'); if (m[0] !== 'BOUTIK1' || m.length < 4) return toast('Code invalide');
  SYNC.cfg = { url: m[1], shop: m[2], key: m[3], since: 0, device: uid() }; toast('Connexion à la boutique…');
  try {
    const j = await api('/api/sync', { shop: m[2], key: m[3], device: SYNC.cfg.device, since: 0, push: [] }); SYNC.cfg.sub = j.sub;
    const d = blank(); d.settings = null; const hashes = {};
    j.pull.forEach(({ c, r }) => { if (c === 'settings') d.settings = r; else if (d[c]) d[c].push(r); hashes[recKey(c, r)] = JSON.stringify(r); });
    if (!d.settings) throw new Error('vide');
    db = migrate(d); sortAll(); recomputeStock(); SYNC.hashes = hashes; SYNC.cfg.since = j.seq; saveSyncState(); saveLocal();
    closeModal(); renderLogin(); setSync('ok'); toast('Téléphone connecté à ' + db.settings.shopName);
  } catch (e) { SYNC.cfg = null; saveSyncState(); toast(e.status === 402 ? 'Abonnement de cette boutique expiré ou suspendu' : 'Connexion impossible : vérifiez internet et le code'); }
}

const supName = id => db.suppliers.find(x => x.id === id)?.name || '—';
function supBalances() { return db.suppliers.map(x => { const due = db.supplies.filter(y => y.supplier === x.id).reduce((a, y) => a + y.amount - y.paid, 0), paid = db.supPays.filter(y => y.supplier === x.id).reduce((a, y) => a + y.amount, 0); return { ...x, bought: db.supplies.filter(y => y.supplier === x.id).reduce((a, y) => a + y.amount, 0), bal: due - paid }; }).sort((a, b) => b.bal - a.bal); }

function addSup() { const n = v('sn'); if (!n) return toast('Nom ?'); db.suppliers.push({ id: uid(), name: n, phone: v('sp') }); log('Fournisseur ajouté', n); save(); render(); }
function supDetail(id) {

function paySup(id) { const a = +v('spa'); if (!a) return; const m = v('spm'); db.supPays.unshift({ id: uid(), date: now(), supplier: id, amount: a, method: m, user: me.id }); if (m === 'cash') db.expenses.unshift({ id: uid(), date: now(), cat: 'Paiement fournisseur', detail: supName(id), amount: a, method: 'cash', user: me.id }); log('Paiement fournisseur', `${supName(id)} — ${money(a)}`); save(); closeModal(); render(); toast('Paiement enregistré'); }

/* ================= VÉRIFICATION MOBILE MONEY ================= */
function momoPending() { const from = new Date(Date.now() - 14 * 864e5).toISOString(); return db.sales.filter(s => s.pay === 'momo' && !s.cancelled && s.momoOk === undefined && s.date >= from); }
function setMomo(id, ok) { const s = db.sales.find(x => x.id === id); s.momoOk = ok; log(ok ? 'MoMo confirmé' : 'MoMo NON reçu', `Vente n°${s.no} — ${money(s.total)} — ${userName(s.user)}`); save(); closeModal(); render(); }
VIEWS.momo = function () {
  if (!isOwner()) return go('vendre');
  const list = momoPending();
  main().innerHTML = `<h1>Vérifier le Mobile Money</h1>
    <div class="card"><b>Collez vos SMS de paiement</b><div class="mut" style="margin:4px 0 10px">Ouvrez vos SMS Orange Money / MTN / Moov / Wave, copiez ceux des paiements reçus et collez-les ici. Boutik retrouve les ventes par n° de transaction ou par montant.</div>
      <textarea id="sms" rows="5" placeholder="Vous avez recu 3100 FCFA de 0700000000. Ref: MP241124.1530.A12345…"></textarea>
      <button class="btn acc full" style="margin-top:10px" onclick="matchSms()">${ic('check', 's')} Comparer</button></div>
    <h3>À vérifier (${list.length})</h3>
    <div class="card list" style="padding:4px 16px">${list.length ? list.map(s => `<div class="it"><div class="grow"><b>${money(s.total)}</b> <span class="mut">· n°${s.no} · ${fmtDate(s.date)}</span><div class="mut">${esc(s.op || '')}${s.ref ? ' · réf ' + esc(s.ref) : ' · sans référence'} · ${esc(userName(s.user))}</div></div>
      <button class="ib" style="box-shadow:none;color:var(--bad)" onclick="setMomo('${s.id}',false)">${ic('x', 's')}</button><button class="ib" style="box-shadow:none;color:var(--ok)" onclick="setMomo('${s.id}',true)">${ic('check', 's')}</button></div>`).join('') : emptyBox('check', 'Tous les paiements sont vérifiés')}</div>`;
};
function matchSms() {
  const txt = v('sms'); if (!txt) return toast('Collez au moins un SMS');
  const up = txt.toUpperCase(), flat = up.replace(/[^A-Z0-9]/g, '');
  const amounts = []; (txt.match(/\d{1,3}(?:[ .  ]\d{3})+|\d{3,}/g) || []).forEach(a => amounts.push(+a.replace(/\D/g, '')));
  let byRef = 0, byAmt = 0; const used = {};
  const list = momoPending();
  list.forEach(s => { if (s.ref && s.ref.replace(/[^A-Za-z0-9]/g, '').length >= 5 && flat.includes(s.ref.toUpperCase().replace(/[^A-Z0-9]/g, ''))) { s.momoOk = true; s.momoHow = 'référence'; byRef++; } });
  list.filter(s => s.momoOk === undefined).forEach(s => { const k = amounts.findIndex((a, i) => a === s.total && !used[i]); if (k >= 0) { used[k] = 1; s.momoOk = true; s.momoHow = 'montant'; byAmt++; } });
  log('Vérification MoMo', `${byRef} par référence, ${byAmt} par montant`); save(); render();
  toast(byRef + byAmt ? `${byRef + byAmt} paiement(s) retrouvé(s)` : 'Aucune vente retrouvée dans ces SMS');
}

const PRN = { dev: null, ch: null };
const BT_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '0000fee7-0000-1000-8000-00805f9b34fb'];
async function findChar(dev) { const g = await dev.gatt.connect(); for (const sv of await g.getPrimaryServices()) for (const c of await sv.getCharacteristics()) if (c.properties.write || c.properties.writeWithoutResponse) return c; throw new Error('aucune voie d\'écriture'); }
async function connectPrinter() {
  if (NATIVE && NATIVE.ble) { try { PRN.native = await NATIVE.ble.connect(BT_SERVICES); PRN.ch = { native: true }; PRN.dev = { name: PRN.native.name }; db.settings.printerName = PRN.native.name || 'Imprimante'; save(); render(); toast('Imprimante connectée'); } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Connexion impossible : allumez l\'imprimante et activez le Bluetooth'); } return; }
  if (!navigator.bluetooth) return toast('Bluetooth indisponible : utilisez Chrome sur Android');
  try { const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SERVICES }); PRN.ch = await findChar(dev); PRN.dev = dev; db.settings.printerName = dev.name || 'Imprimante'; save(); render(); toast('Imprimante connectée'); }
  catch (e) { if (!/cancel/i.test(String(e))) toast('Connexion impossible : allumez l\'imprimante et réessayez'); }
}
async function btSend(bytes) {
  if (PRN.native) { try { await NATIVE.ble.write(PRN.native, bytes); return true; } catch (e) { PRN.native = null; PRN.ch = null; toast('Impression interrompue : reconnectez l\'imprimante'); return false; } }
  if (!PRN.ch && PRN.dev) { try { PRN.ch = await findChar(PRN.dev); } catch (e) {} }
  if (!PRN.ch) { toast('Connectez d\'abord l\'imprimante (Paramètres)'); return false; }
  try { for (let i = 0; i < bytes.length; i += 160) { const part = bytes.slice(i, i + 160); if (PRN.ch.properties.writeWithoutResponse) await PRN.ch.writeValueWithoutResponse(part); else await PRN.ch.writeValue(part); await new Promise(r => setTimeout(r, 25)); } return true; }
  catch (e) { PRN.ch = null; toast('Impression interrompue : reconnectez l\'imprimante'); return false; }
}
function escpos() {
  const b = []; const enc = s => { s = String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[  ]/g, ' ').replace(/[^\x20-\x7e\n]/g, '?'); for (const ch of s) b.push(ch.charCodeAt(0)); };
  const o = {
    init() { b.push(0x1b, 0x40); return o; }, center() { b.push(0x1b, 0x61, 1); return o; }, left() { b.push(0x1b, 0x61, 0); return o; },
    bold(x) { b.push(0x1b, 0x45, x ? 1 : 0); return o; }, big(x) { b.push(0x1d, 0x21, x ? 0x11 : 0); return o; },
    line(s = '') { enc(s + '\n'); return o; }, cols(l, r, w = 32) { l = String(l); r = String(r); const sp = w - r.length; enc((l.length > sp - 1 ? l.slice(0, sp - 1) : l).padEnd(sp) + r + '\n'); return o; },
    qr(data, size = 6) { const d = [...new TextEncoder().encode(data)], L = d.length + 3; b.push(0x1d, 0x28, 0x6b, 4, 0, 0x31, 0x41, 0x32, 0, 0x1d, 0x28, 0x6b, 3, 0, 0x31, 0x43, size, 0x1d, 0x28, 0x6b, 3, 0, 0x31, 0x45, 0x31, 0x1d, 0x28, 0x6b, L & 255, L >> 8, 0x31, 0x50, 0x30, ...d, 0x1d, 0x28, 0x6b, 3, 0, 0x31, 0x51, 0x30); return o; },
    feed(n = 3) { b.push(0x1b, 0x64, n); return o; }, bytes() { return new Uint8Array(b); } };
  return o;
}
function printReceipt(s) {

  if (db.settings.contact) e.line(db.settings.contact);

}

/* ================= CONNEXION PAR VISAGE OU EMPREINTE (propriétaire) =================
   Le téléphone vérifie lui-même (Face ID, empreinte, visage Android ou code du téléphone).
   Rien de biométrique n'est stocké par Boutik : seul l'identifiant de la clé, sur CET appareil. */
const BIO_K = () => kf('boutik_bio');
let BIO_OK = false;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function bioSaved() { try { return JSON.parse(localStorage.getItem(BIO_K())); } catch (e) { return null; } }
function bioReady() { return BIO_OK && !!bioSaved(); }
async function bioInit() { try { BIO_OK = NATIVE && NATIVE.bio ? await NATIVE.bio.available() : !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { BIO_OK = false; } }
function bioCard() {
  if (!BIO_OK) return `<div class="card row"><div class="ico">${ic('finger')}</div><div class="grow"><b>Visage ou empreinte</b><div class="mut">Non disponible sur ce téléphone ou ce navigateur (il faut Chrome ou Safari, sur une adresse https).</div></div></div>`;
  const on = bioSaved();
  return `<div class="card"><div class="row"><div class="ico ${on ? 'ok' : 'acc'}">${ic('finger')}</div><div class="grow"><b>Connexion par visage ou empreinte</b><div class="mut">${on ? 'Activée sur ce téléphone depuis le ' + new Date(on.date).toLocaleDateString('fr-FR') + '.' : 'Entrez sans taper votre code, et validez les remises ou annulations d\'un geste.'}</div></div></div>
    ${on ? `<div class="g2" style="margin-top:12px"><button class="btn ghost" onclick="bioCheck().then(ok=>toast(ok?'Reconnu ✓':'Non reconnu'))">Tester</button><button class="btn soft" onclick="bioOff()">Désactiver</button></div>`
    : `<div class="card row" style="background:var(--warnl);box-shadow:none;margin:12px 0 0"><div class="ico warn">${ic('alert', 's')}</div><div class="grow mut">À activer seulement sur <b style="color:var(--ink)">votre</b> téléphone : toute personne dont le visage ou l'empreinte est enregistré dans ce téléphone pourra entrer comme propriétaire.</div></div>
       <button class="btn acc full" style="margin-top:12px" onclick="bioOn()">${ic('finger', 's')} Activer sur ce téléphone</button>`}
    <div class="mut" style="margin-top:10px">Votre code secret reste toujours valable, en secours.</div></div>`;
}
async function bioOn() {
  if (!(await ownerAuth('Activer la connexion par visage ou empreinte'))) return;
  if (NATIVE && NATIVE.bio) { if (!(await NATIVE.bio.auth('Activer la connexion de ' + (db.settings.ownerName || 'propriétaire')))) return toast('Activation annulée'); localStorage.setItem(BIO_K(), JSON.stringify({ native: true, date: now() })); log('Connexion biométrique activée', 'sur ce téléphone'); save(); render(); return toast('Activé : vous entrerez avec votre visage ou votre empreinte'); }
  try {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Boutik' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: (db.settings.shopName + ' — ' + db.settings.ownerName).slice(0, 60), displayName: db.settings.ownerName || 'Propriétaire' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none' } });
    localStorage.setItem(BIO_K(), JSON.stringify({ id: b64(c.rawId), date: now() }));
    log('Connexion biométrique activée', 'sur ce téléphone'); save(); render(); toast('Activé : vous entrerez avec votre visage ou votre empreinte');
  } catch (e) { toast(/NotAllowed|abort/i.test(e.name + e.message) ? 'Activation annulée' : 'Activation impossible sur ce téléphone'); }
}
async function bioCheck() {
  const sv = bioSaved(); if (!sv) return false;
  if (sv.native) return NATIVE && NATIVE.bio ? NATIVE.bio.auth('Connexion propriétaire') : false;
  try {
    const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(sv.id), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });
    return !!(a && b64(a.rawId) === sv.id && a.response && a.response.authenticatorData);
  } catch (e) { return false; }
}
async function bioLogin() {
  if (!(await bioCheck())) return;
  me = { id: 'owner', role: 'owner' }; log('Connexion', 'visage / empreinte'); save(); cart = newCart(); view = 'home'; render();
}
async function bioOff() { if (!(await ask('Désactiver la connexion par visage ou empreinte sur ce téléphone ?', { ok: 'Désactiver' }))) return; try { localStorage.removeItem(BIO_K()); } catch (e) {} log('Connexion biométrique désactivée'); save(); render(); }

/* ================= ASSISTANT =================
   Répond hors connexion aux questions sur la boutique (ventes, stock, vendeurs, crédits…)
   et sur l'utilisation de l'appli. Un vendeur n'obtient jamais les marges, prix d'achat ni l'argent attendu.
   Option : questions libres via l'IA en ligne du serveur, si le fournisseur l'a activée. */
const ASK = { msgs: [], acts: [], ai: null, busy: false };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const has = (q, re) => re.test(q);
function rangeFor(q) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  if (has(q, /\bhier\b/)) { const a = new Date(d0); a.setDate(a.getDate() - 1); return [a.toISOString(), d0.toISOString(), 'hier']; }
  if (has(q, /semaine|7 jours|sept jours/)) { const a = new Date(d0); a.setDate(a.getDate() - 6); return [a.toISOString(), now(), 'ces 7 derniers jours']; }
  if (has(q, /\bmois\b|30 jours/)) { const a = new Date(d0); a.setDate(1); return [a.toISOString(), now(), 'ce mois-ci']; }
  if (has(q, /\ban\b|annee/)) { const a = new Date(d0); a.setMonth(0, 1); return [a.toISOString(), now(), 'cette année']; }
  return [d0.toISOString(), now(), "aujourd'hui"];
}
function salesStats(from, to, user) {
  const ss = db.sales.filter(s => !s.cancelled && s.date >= from && s.date <= to && (!user || s.user === user));
  const ca = ss.reduce((a, s) => a + s.total, 0), cost = ss.reduce((a, s) => a + s.items.reduce((b, i) => b + i.qty * i.cost, 0), 0);
  const by = { cash: 0, momo: 0, credit: 0 }; ss.forEach(s => by[s.pay] += s.total);
  const prodQ = {}; ss.forEach(s => s.items.forEach(i => { const k = i.pid; prodQ[k] = prodQ[k] || { name: prod(k)?.name || i.name, q: 0, ca: 0 }; prodQ[k].q += i.qty * (i.mult || 1); prodQ[k].ca += i.qty * i.price; }));
  return { n: ss.length, ca, marge: ca - cost, by, prodQ };
}
function findProduct(q) {
  let best = null, score = 0;
  db.products.filter(p => p.active).forEach(p => {
    if (q.includes(norm(p.code))) { best = p; score = 99; return; }
    const w = norm(p.name).split(' ').filter(x => x.length > 2 && !/^(de|des|les|pour|avec|sac|kg)$/.test(x));
    const sc = w.filter(x => q.includes(x)).length + (q.includes(norm(p.name)) ? 3 : 0);
    if (sc > score) { score = sc; best = p; }
  });
  return score > 0 ? best : null;
}
function findEmp(q) { return db.employees.find(e => q.split(' ').includes(norm(e.name))) || null; }

function insights() {
  const out = [], d30 = new Date(Date.now() - 30 * 864e5).toISOString(), d7 = new Date(Date.now() - 7 * 864e5).toISOString();
  const s7 = salesStats(d7, now()).prodQ, s30 = salesStats(d30, now()).prodQ;
  const act7 = db.products.filter(p => p.active && s7[p.id] && p.stock <= Math.max(p.min, s7[p.id].q / 7 * 3)).sort((a, b) => s7[b.id].q - s7[a.id].q).slice(0, 3);
  act7.forEach(p => out.push(`${B('Rachetez vite ' + esc(p.name))} : ${nq(s7[p.id].q)} vendus en 7 jours, il en reste ${nq(p.stock)} (environ ${Math.max(0, Math.floor(p.stock / Math.max(.01, s7[p.id].q / 7)))} jour(s)).`));
  const first = {}; db.moves.forEach(m => { if (!first[m.pid] || m.date < first[m.pid]) first[m.pid] = m.date; });
  const dorm = db.products.filter(p => p.active && p.stock > 0 && !s30[p.id] && first[p.id] && first[p.id] < d30);
  const dv = dorm.reduce((a, p) => a + p.stock * p.cost, 0);
  if (dorm.length && dv > 0) out.push(`${B(dorm.length + ' produit(s) dorment')} : rien vendu depuis 30 jours, ${money(dv)} immobilisés (${dorm.slice(0, 3).map(p => esc(p.name)).join(', ')}…). Faites une promotion ou arrêtez d'en racheter.`);
  const low = db.products.filter(p => p.active && p.cost > 0 && p.price < p.cost * 1.08);
  if (low.length) out.push(`${B('Marge trop faible')} sur ${low.slice(0, 3).map(p => esc(p.name)).join(', ')} : moins de 8 % au-dessus du prix d'achat.`);
  const debts = clientBalances().filter(c => c.bal > 0);
  if (debts.length) out.push(`${B(money(debts.reduce((a, c) => a + c.bal, 0)) + ' de crédits clients')} à récupérer. Le plus gros : ${esc(debts[0].n)} (${money(debts[0].bal)}).`);
  db.employees.filter(e => e.active).forEach(e => { const r = empRisk(e.id); if (r.missing < 0) out.push(`${B(esc(e.name) + ' : ' + money(-r.missing) + ' de manques')} en 30 jours. Vérifiez ses postes et pensez au comptage à l'aveugle.`); else if (r.manualPct >= 30 && r.n >= 10) out.push(`${B(esc(e.name))} saisit ${r.manualPct} % des articles sans scanner : imprimez des étiquettes et coupez « Vendre sans scanner ».`); });
  const mp = db.sales.filter(s => s.pay === 'momo' && s.momoOk === false && !s.cancelled);
  if (mp.length) out.push(`${B(mp.length + ' paiement(s) Mobile Money non reçus')} : ${money(mp.reduce((a, s) => a + s.total, 0))}.`);
  return out.slice(0, 6);
}

function answer(raw) {

  if (how || !dataWord) { const h = HOWTO.find(([re]) => re.test(q)); if (h) return { text: `${B(h[1])}<br>${h[2]()}`, actions: h[3]() }; }
  const p = findProduct(q);
  // Questions sur un produit (tout le monde)
  if (p && !has(q, /vendu|vente/)) {

    return { text: `${B(esc(p.name))}<br>Prix : ${B(money(p.price) + u)}${pk}${p.wholesale && F('gros') ? ` · gros : ${money(p.wholesale)}` : ''}<br>En stock : ${B(stockLabel(p))}${p.stock <= p.min ? ' <span class="pill warn">stock bas</span>' : ''}${own ? `<br>Prix d'achat : ${money(p.cost)} · marge ${p.price ? Math.round((p.price - p.cost) / p.price * 100) : 0} %` : ''}`, actions: own ? [act('Fiche produit', () => { go('stock'); editProduct(p.id); })] : [] };

    if (has(q, /benefice|marge|prix d achat|attendu|caisse.*combien|combien.*caisse|tous les vendeurs|chiffre|vol|manque|ecart|qui me doit|credit.*total|fournisseur|depense|valeur/)) return { text: 'Cette information est réservée au patron.' };
    const h = HOWTO.find(([re]) => re.test(q)); if (h) return { text: `${B(h[1])}<br>${h[2]()}`, actions: h[3]() };
    return null;
  }
  // ===== Données du propriétaire =====

  if (has(q, /conseil|astuce|ameliorer|gagner plus|vendre plus|que faire|recommand|analyse/)) { const ins = insights(); return { text: ins.length ? `${B('Mes conseils')}${li(ins)}` : 'Tout va bien : pas de rupture urgente, pas de manque de caisse, pas de produit qui dort. Continuez !' }; }

    db.employees.forEach(x => { const r = empRisk(x.id); if (r.manualPct >= 30 && r.n >= 5) lines.push(`${esc(x.name)} : ${r.manualPct} % d'articles sans scan`); });

  }

  if (has(q, /meilleur|plus vendu|top|marche (le )?mieux|populaire/)) { const t = Object.values(salesStats(from, to).prodQ).sort((a, b) => b.ca - a.ca).slice(0, 5); return { text: t.length ? `${B('Meilleurs produits ' + lab)}${li(t.map(x => `${esc(x.name)} : ${nq(x.q)} vendus · ${money(x.ca)}`))}` : `Pas de vente ${lab}.` }; }

  if (has(q, /qui me doit|credit|dette client|clients? (me )?doi/)) { const c = clientBalances().filter(x => x.bal > 0); return { text: c.length ? `${B(money(c.reduce((a, x) => a + x.bal, 0)) + ' à récupérer')}${li(c.slice(0, 8).map(x => `${esc(x.n)} : ${money(x.bal)}`))}` : 'Personne ne vous doit d\'argent.', actions: [act('Crédits clients', () => go('credits'))] }; }
  if (has(q, /fournisseur|je dois|mes dettes/)) { const s = supBalances().filter(x => x.bal > 0); return { text: s.length ? `${B('Vous devez ' + money(s.reduce((a, x) => a + x.bal, 0)))}${li(s.map(x => `${esc(x.name)} : ${money(x.bal)}`))}` : 'Vous ne devez rien à vos fournisseurs.', actions: F('fournisseurs') ? [act('Fournisseurs', () => go('fournisseurs'))] : [] }; }
  if (has(q, /depense/)) { const ex = db.expenses.filter(x => !x.deleted && x.date >= from && x.date <= to), by = {}; ex.forEach(x => by[x.cat] = (by[x.cat] || 0) + x.amount); return { text: `${B('Dépenses ' + lab + ' : ' + money(ex.reduce((a, x) => a + x.amount, 0)))}${li(Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, x]) => `${esc(k)} : ${money(x)}`))}` }; }

}

function aiContext() {

    top: Object.values(s30.prodQ).sort((a, b) => b.ca - a.ca).slice(0, 15), produits: prods, vendeurs: db.employees.map(e => ({ nom: e.name, ...empRisk(e.id) })), credits: clientBalances().filter(c => c.bal > 0).slice(0, 10).map(c => ({ client: c.n, doit: c.bal })),
    fournisseurs: supBalances().filter(x => x.bal > 0).map(x => ({ nom: x.name, du: x.bal })), a_controler: pendingCount(), conseils_calcules: insights().map(x => x.replace(/<[^>]+>/g, '')) };
}
async function aiAvailable() {

}

  ASK.msgs.push({ me: false, html: a.text, actions: a.actions || [] }); if (ASK.msgs.length > 40) ASK.msgs.splice(0, ASK.msgs.length - 40);
  drawAsk();
  if (F('voice')) speak(a.text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 300));
  log('Assistant', q.slice(0, 80));
}
function askVoice() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return;
  try { const r = new R(); r.lang = 'fr-FR'; r.interimResults = false; r.onresult = e => { const t = e.results[0][0].transcript; askSend(t); }; r.onerror = () => toast('Micro indisponible (il faut internet pour la dictée)'); r.start(); toast('Parlez…'); } catch (e) { toast('Micro indisponible'); }
}

function installBtn() { return `<button id="instbtn" class="btn soft full" style="margin-top:18px;${installEvt ? '' : 'display:none'}" onclick="installEvt&&installEvt.prompt()">${ic('down', 's')} Installer l'appli sur ce téléphone</button>`; }
/* Application mobile (Capacitor) : charge le pont natif si l'appli tourne dans le téléphone */
var NATIVE = null;
async function bootNative() {
  try {
    if (!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;
    await loadScript('config.js').catch(() => {}); await loadScript('native.js');
    NATIVE = window.BoutikNative || null;
  } catch (e) { NATIVE = null; }
}
bootNative().then(async () => {
  try { if (!NATIVE && 'serviceWorker' in navigator && /^https:$/.test(location.protocol) && defaultServer()) navigator.serviceWorker.register('/sw.js').catch(() => {}); } catch (e) {}
  await bioInit();
  recomputeStock();
  start();
  syncNow();
});
